<!doctype html>

<head>

<title>Rising Stars AI</title>
<style>
:root { color-scheme: light; --bg:#f1f3f9; --paper:#fff; --ink:#222b46; --muted:#68758e; --line:#dfe5ef; --accent:#4b59cf; --soft:#edf0ff; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif; }
button,input,select { font:inherit; color:inherit; }
button { cursor:pointer; }
button:disabled { cursor:not-allowed; opacity:.4; }
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible { outline:3px solid #e99b44; outline-offset:3px; }
a { color:var(--accent); }
.shell { max-width:1440px; margin:auto; padding:0 clamp(18px,4vw,58px) 56px; }
.top { min-height:78px; display:flex; justify-content:space-between; align-items:center; gap:18px; border-bottom:1px solid var(--line); }
.logo { font-size:21px; font-weight:800; letter-spacing:-.045em; white-space:nowrap; }
.logo-mark { display:inline-grid; place-items:center; width:30px; height:30px; margin-right:9px; background:var(--accent); color:#fff; border-radius:9px; }
.top-right { display:flex; gap:18px; align-items:center; color:var(--muted); font-size:12px; }
.language { border:1px solid #d4dcef; background:var(--paper); border-radius:9px; padding:8px 11px; font-weight:700; white-space:nowrap; }
.hero { display:flex; justify-content:space-between; align-items:end; gap:24px; padding:38px 0 25px; }
.eyebrow { color:var(--accent); font-size:11px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; }
h1 { font-size:clamp(31px,4vw,48px); letter-spacing:-.05em; line-height:1.1; margin:10px 0 8px; }
.hero p { max-width:640px; margin:0; color:var(--muted); }
.pool { flex-shrink:0; min-width:140px; border-left:1px solid #d1d8e7; padding-left:24px; }
.pool strong { display:block; font-size:30px; line-height:1.15; letter-spacing:-.04em; }
.pool span { color:var(--muted); font-size:12px; }
.toolbar,.filters { display:flex; align-items:center; flex-wrap:wrap; gap:10px; }
.toolbar { margin:0 0 12px; }
.group { display:flex; flex-wrap:wrap; gap:3px; background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:4px; }
.group button { border:0; background:transparent; border-radius:7px; padding:8px 12px; color:var(--muted); font-size:12px; font-weight:700; }
.group button[aria-pressed="true"] { background:var(--ink); color:#fff; }
.group button[data-sort="newcomers"][aria-pressed="true"] { background:var(--accent); }
.filters input { flex:1; min-width:210px; max-width:360px; height:40px; border:1px solid var(--line); background:var(--paper); border-radius:9px; padding:0 11px; font-size:12px; }
.tagbar { display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin:0 0 4px; }
.chip { border:1px solid var(--line); background:var(--paper); border-radius:999px; padding:6px 12px; color:var(--muted); font-size:12px; font-weight:650; }
.chip[aria-pressed="true"] { border-color:var(--accent); background:var(--accent); color:#fff; }
.result-heading { display:flex; justify-content:space-between; align-items:baseline; gap:14px; margin:24px 0 11px; }
.result-heading strong { font-size:15px; }
.result-heading span { color:var(--muted); font-size:11px; }
.workspace { display:grid; grid-template-columns:minmax(0,1.1fr) minmax(350px,.9fr); gap:16px; align-items:start; }
.repo-list,.detail,.empty { background:var(--paper); border:1px solid var(--line); border-radius:14px; }
.repo-list { overflow:hidden; }
.repo-row { display:grid; grid-template-columns:35px minmax(0,1fr); gap:10px; width:100%; text-align:left; background:transparent; border:0; border-bottom:1px solid var(--line); padding:18px 16px; }
.repo-row:last-child { border-bottom:0; }
.repo-row:hover { background:#f7f8ff; }
.repo-row[aria-pressed="true"] { background:var(--soft); box-shadow:inset 3px 0 var(--accent); }
.rank { color:#8e9ab2; font-size:12px; font-weight:800; font-variant-numeric:tabular-nums; }
.repo-name { display:block; overflow-wrap:anywhere; font-size:14px; font-weight:750; }
.owner { color:var(--muted); font-weight:500; }
.summary { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; margin:5px 0 8px; color:var(--muted); font-size:12px; line-height:1.55; }
.mini { display:flex; flex-wrap:wrap; gap:4px 14px; color:var(--muted); font-size:11px; }
.mini b { color:var(--ink); font-variant-numeric:tabular-nums; }
.mini .highlight { color:var(--accent); }
.detail { position:sticky; top:16px; padding:26px; min-width:0; }
.detail h2 { margin:8px 0 12px; overflow-wrap:anywhere; font-size:23px; line-height:1.3; letter-spacing:-.025em; }
.detail h2 a { color:var(--ink); text-decoration:none; }
.detail h2 a:hover { text-decoration:underline; }
.intro { color:#4b5973; font-size:14px; line-height:1.8; margin:0 0 14px; }
.notice { color:var(--muted); font-size:12px; }
.tags { display:flex; flex-wrap:wrap; gap:6px; margin:14px 0; }
.tag { background:var(--soft); color:#4250b8; border-radius:6px; padding:4px 7px; font-size:11px; font-weight:650; }
.tag.secondary { background:#f5f6fa; color:var(--muted); }
.metrics { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); margin-top:20px; }
.metric { border-top:1px solid var(--line); padding:14px 8px 14px 0; }
.metric span { display:block; color:var(--muted); font-size:11px; }
.metric strong { display:block; margin-top:3px; font-size:19px; font-variant-numeric:tabular-nums; }
.metric.highlight strong { color:var(--accent); }
.quality { color:var(--muted); font-size:12px; }
.quality.incomplete { color:#a35608; }
.sources { display:flex; align-items:center; flex-wrap:wrap; gap:10px 18px; margin-top:17px; font-size:12px; }
.sources a { font-weight:700; }
details.original { margin-top:18px; color:var(--muted); font-size:12px; }
details.original summary { cursor:pointer; }
details.original p { overflow-wrap:anywhere; }
.empty { padding:45px 20px; text-align:center; color:var(--muted); }
footer { margin-top:36px; border-top:1px solid var(--line); padding-top:16px; color:var(--muted); font-size:11px; line-height:1.8; }
footer strong { color:var(--ink); }
@media(max-width:760px) {
 .shell { padding:0 16px 40px; }
 .top { min-height:65px; }
 .top-right .updated { display:none; }
 .hero { padding:28px 0 20px; }
 .pool { min-width:auto; padding-left:14px; }
 .pool strong { font-size:23px; }
 .pool span { white-space:nowrap; }
 .group { width:100%; }
 .group button { flex:1; padding:8px 6px; }
 .filters input { max-width:none; width:100%; }
 .result-heading { display:block; }
 .result-heading span { display:block; margin-top:5px; }
 .workspace { grid-template-columns:1fr; }
 .detail { position:static; padding:21px; }
 .repo-row { padding:16px 13px; }
}
</style>
</head>

eration": 0.0, "p_added": 48.83, "p_accel": 61.21, "score": 55.02, "complete": true, "days_available": 14}, {"rank": 99, "repo_id": 1332073142, "full_name": "NanmiCoder/dsh-agent-teams", "url": "https://github.com/NanmiCoder/dsh-agent-teams", "description": "DeepSeek Harness 的 Agent Teams 多智能体协作插件，支持多个 AI Agent 组成团队，协同完成复杂任务，实现任务分配、并行执行、成员通信与团队协作。 AgentTeams plugin for DeepSeek Harness", "stars": 3092, "created_at": "2026-08-12T13:41:50Z", "pool": "newcomer", "domains": ["Agent"], "forms": ["Agent", "Harness", "工具"], "kinds": ["tool"], "added": 52, "added_previous": 86, "velocity": 7.428571428571429, "acceleration": -0.6938775510204083, "p_added": 48.83, "p_accel": 19.62, "score": 34.23, "complete": true, "days_available": 14}, {"rank": 100, "repo_id": 1307383231, "full_name": "Jakubantalik/thinking-orbs", "url": "https://github.com/Jakubantalik/thinking-orbs", "description": "Dotted thought-orb loading indicators for AI & agent UIs, 9 tuned types, two sizes, auto dark/light", "stars": 4104, "created_at": "2026-07-21T07:01:53Z", "pool": "newcomer", "domains": ["Agent"], "forms": ["Agent"], "kinds": ["tool"], "added": 51, "added_previous": 29, "velocity": 7.285714285714286, "acceleration": 0.44897959183673464, "p_added": 48.53, "p_accel": 87.27, "score": 67.9, "complete": true, "days_available": 14}]}}, "descriptions": {"1104332987": {"full_name": "666ghj/MiroFish", "zh": "MiroFish 是基于多智能体模拟的预测与情景探索工具。用户上传新闻、报告或故事等材料并描述问题后，系统构建模拟环境，让不同角色互动，生成预测报告，并支持与模拟角色或报告智能体对话；模拟结果不等于可靠预测。", "en": "MiroFish is a multi-agent simulation tool for forecasting and exploring scenarios. Given source materials such as news, reports, or stories and a natural-language question, it builds a simulated environment, generates a report, and lets users interact with simulated agents or the report agent; simulated outcomes are not guaranteed predictions.", "source": "https://github.com/666ghj/MiroFish/blob/main/README.md"}, "1201476594": {"full_name": "career-ops-hq/career-ops", "zh": "career-ops 是面向求职者的开源 AI 求职助手，在本机和已有 AI CLI 中运行。用户提供职位后，它会检查职位是否仍开放、评估匹配度，并协助定制简历和起草申请回答；最终由用户自行提交。", "en": "career-ops is an open-source AI job-search assistant that runs locally in an existing AI CLI. Given a job listing, it checks whether the role is still open, evaluates fit, and helps tailor a CV and draft application answers; the user submits the application.", "source": "https://github.com/career-ops-hq/career-ops/blob/main/README.md"}, "1201173969": {"full_name": "JuliusBrussee/caveman", "zh": "Caveman 面向 AI 智能体的 token 使用优化，提供精简回答的技能，以及压缩日志、JSON 和网页等输入的功能。它还提供模型与推理强度选择及可复用脚本等组件，可与 Claude Code、Codex 和其他智能体配合使用。", "en": "Caveman aims to reduce AI-agent token use through concise-answer skills and compression of inputs such as logs, JSON, and web pages. It also offers model and reasoning-effort selection and reusable scripts, and integrates with Claude Code, Codex, and other agents.", "source": "https://github.com/JuliusBrussee/caveman/blob/main/README.md"}, "1165277268": {"full_name": "Panniantong/Agent-Reach", "zh": "Agent Reach 为命令行智能体提供访问和搜索多个互联网平台的渠道。它可按渠道执行操作或根据链接读取内容，涵盖 GitHub 仓库和 issue、B 站及 YouTube 字幕等场景。", "en": "Agent Reach gives command-line agents channels for accessing and searching multiple internet platforms. It can run channel-specific actions or read a supported URL, including GitHub repositories and issues and subtitles from Bilibili and YouTube.", "source": "https://github.com/Panniantong/Agent-Reach"}, "1061953414": {"full_name": "anthropics/skills", "zh": "Anthropic 的公开技能示例库展示如何用包含指令、脚本和资源的文件夹扩展 Claude 的专项能力，覆盖创意、开发、文档及企业工作流。每个技能通过 SKILL.md 提供说明；仓库还包含 DOCX、PDF、PPTX 和 XLSX 技能，其许可与开源示例不同。", "en": "Anthropic’s public skills repository demonstrates how folders of instructions, scripts, and resources extend Claude for creative, development, document, and business workflows. Each skill uses a SKILL.md file; the included DOCX, PDF, PPTX, and XLSX skills have different licensing from the open-source examples.", "source": "https://github.com/anthropics/skills"}, "1024554267": {"full_name": "NousResearch/hermes-agent", "zh": "Hermes Agent 是 Nous Research 开发的 AI 智能体，可通过终端或 Telegram、Discord 等消息平台交互。它支持跨会话记忆、从经验创建和改进技能、定时任务及多种模型提供商，也可委派子智能体并行工作。", "en": "Hermes Agent is an AI agent from Nous Research that can be used through a terminal or messaging platforms such as Telegram and Discord. It supports cross-session memory, creating and improving skills from experience, scheduled tasks, multiple model providers, and parallel subagents.", "source": "https://github.com/NousResearch/hermes-agent"}, "1343011496": {"full_name": "Vincentwei1021/video-talkcraft", "zh": "video-talkcraft 是用于制作口播解说视频的 AI 代理技能，可与 Claude Code 或 Codex 配合使用。它将口播稿与配音按字对齐，以分镜和动效配方组织画面，再通过 Remotion 渲染，并提供画面和音效检查。", "en": "video-talkcraft is an AI agent skill for making narrated explainer videos with Claude Code or Codex. It aligns scripts to voice recordings at word level, organizes visuals using storyboards and motion recipes, renders with Remotion, and includes visual and audio checks.", "source": "https://github.com/Vincentwei1021/video-talkcraft"}, "1200597263": {"full_name": "Graphify-Labs/graphify", "zh": "Graphify 将代码、文档等项目资料整理成可查询的知识图谱，帮助编码智能体探索项目结构和关联。代码使用本地 tree-sitter AST 解析；文档、PDF、图像和视频的语义处理则使用智能体模型或配置的 API。", "en": "Graphify turns project materials such as code and documentation into a queryable knowledge graph for exploring structure and relationships. Code is parsed locally with tree-sitter ASTs, while semantic processing of documents, PDFs, images, and video uses an agent model or configured API.", "source": "https://github.com/Graphify-Labs/graphify"}, "1266797999": {"full_name": "DietrichGebert/ponytail", "zh": "Ponytail 为编程智能体提供一套简洁开发规则，优先复用现有代码和平台能力，避免不必要的抽象与依赖。它强调不能为减少代码而牺牲验证、安全或无障碍，并提供审查和梳理简化债务的命令。", "en": "Ponytail gives coding agents a set of simplicity-oriented development rules that favor existing code and native capabilities over unnecessary abstractions and dependencies. It explicitly preserves validation, security, and accessibility, and includes commands for review and tracking deliberate simplifications.", "source": "https://github.com/DietrichGebert/ponytail"}, "1048065319": {"full_name": "thedotmack/claude-mem", "zh": "为 Claude Code 等智能体提供跨会话记忆，自动记录工具使用观察并生成语义摘要，供后续会话恢复项目上下文。它提供记忆搜索和本地网页查看器，也可用 private 标签排除不希望保存的内容。", "en": "Claude-Mem provides cross-session memory for agents including Claude Code, capturing tool-use observations and producing semantic summaries for later sessions. It offers memory search and a local web viewer, with private tags to exclude sensitive content from storage.", "source": "https://github.com/thedotmack/claude-mem"}, "1097346685": {"full_name": "pbakaus/impeccable", "zh": "Impeccable 为编程智能体提供界面设计指令，帮助调整已有页面或组件，也可用于创建新页面。其 critique 和 audit 工作流分别检查设计与可用性以及无障碍、性能、主题和响应式表现，还提供无需模型调用的确定性问题检测。", "en": "Impeccable gives coding agents design instructions for refining existing interfaces or building new pages. Its critique and audit workflows review design and usability, accessibility, performance, theming, and responsiveness; deterministic checks also flag common design issues without an LLM.", "source": "https://github.com/pbakaus/impeccable"}, "787076358": {"full_name": "firecrawl/firecrawl", "zh": "Firecrawl 提供面向 AI 应用的网页搜索、抓取和交互 API，可将网页内容转为 Markdown、结构化 JSON 或截图。它还支持整站爬取、URL 发现、批量抓取以及 PDF 和 DOCX 文档解析，并提供托管服务。", "en": "Firecrawl provides web search, scraping, and interaction APIs for AI applications, returning content as Markdown, structured JSON, or screenshots. It also supports site crawling, URL discovery, batch scraping, and PDF and DOCX parsing, with a hosted service available.", "source": "https://github.com/firecrawl/firecrawl/blob/main/README.md"}, "909213664": {"full_name": "TauricResearch/TradingAgents", "zh": "TradingAgents 是基于大语言模型的多智能体金融交易研究框架，模拟不同角色协作分析市场并形成交易决策。项目提供命令行运行和历史回测等能力，适合研究多智能体交易分析流程，不能据此保证投资收益。", "en": "TradingAgents is an LLM-based multi-agent financial trading research framework that models collaboration among different roles to analyze markets and make trading decisions. It supports command-line runs and historical backtesting; it does not guarantee investment returns.", "source": "https://github.com/TauricResearch/TradingAgents"}, "1170821064": {"full_name": "paperclipai/paperclip", "zh": "Paperclip 是管理 AI 智能体团队的应用，包含 Node.js 服务端和 React 界面，可将不同智能体组织到共同目标下。用户可分配任务、设定预算与权限，并在仪表盘跟踪工作、成本和历史记录。", "en": "Paperclip is an application for managing teams of AI agents, with a Node.js server and React interface for coordinating different agents around shared goals. Users can assign tasks, set budgets and permissions, and track work, costs, and history in a dashboard.", "source": "https://github.com/paperclipai/paperclip"}, "771302083": {"full_name": "OpenHands/OpenHands", "zh": "OpenHands 仓库提供 Agent Canvas，一个可自托管的编程智能体与自动化控制中心。它可运行 OpenHands 或兼容 ACP 的第三方智能体，连接本地、Docker、远程或云端后端，并通过定时任务或事件触发工作流。", "en": "The OpenHands repository provides Agent Canvas, a self-hostable control center for coding agents and automations. It can run OpenHands or third-party ACP-compatible agents across local, Docker, remote, or cloud backends, and trigger workflows on schedules or events.", "source": "https://github.com/OpenHands/OpenHands/blob/main/README.md"}, "1157102282": {"full_name": "cheaper-inference/OmniRoute", "zh": "OmniRoute 是统一 AI 模型访问的网关，为编码工具提供单一入口并连接多个模型供应商。它支持配额感知的自动回退，并提供免费额度目录；第三方免费额度需要用户自行满足供应商的账户和使用条件。", "en": "OmniRoute is an AI gateway that gives coding tools a single endpoint for connecting to multiple model providers. It supports quota-aware automatic fallback and catalogs free tiers, which remain subject to each third-party provider’s account requirements and terms.", "source": "https://github.com/cheaper-inference/OmniRoute"}, "626805178": {"full_name": "langgenius/dify", "zh": "Dify 是用于开发大模型应用的平台，提供可视化工作流、模型管理和提示词编辑等功能。它支持从文档导入到检索的 RAG 流程、工具连接和代理，并提供云端及自托管选项。", "en": "Dify is a platform for building LLM applications with visual workflows, model management, and prompt editing. It supports RAG from document ingestion to retrieval, tool-connected agents, and both cloud and self-hosted deployments.", "source": "https://github.com/langgenius/dify"}, "1432967563": {"full_name": "ccch1mneyyy/dsh-Go", "zh": "DSH Go 是 DeepSeek Harness 的 Android 客户端，既能在手机内置 Linux 环境中运行，也能切换到电脑上的 DSH 会话。它支持生成时插话、消息排队，以及在原生界面和官方网页版之间切换。", "en": "DSH Go is an Android client for DeepSeek Harness that runs in a built-in Linux environment or connects to DSH on a computer. It supports steering during responses, queued messages, and switching between its native interface and the official web interface.", "source": "https://github.com/ccch1mneyyy/dsh-Go"}, "1031912724": {"full_name": "farion1231/cc-switch", "zh": "CC Switch 是适用于 Windows、macOS 和 Linux 的桌面管理工具，面向 Claude Code、Codex、Gemini CLI 等智能体工具。它支持切换 API 供应商，并集中管理 MCP、技能和提示词，减少手工编辑配置文件的需要。", "en": "CC Switch is a desktop manager for Windows, macOS, and Linux that works with tools including Claude Code, Codex, and Gemini CLI. It switches API providers and centralizes MCP, skills, and prompt management to reduce manual configuration editing.", "source": "https://github.com/farion1231/cc-switch"}, "1075372545": {"full_name": "msitarzewski/agency-agents", "zh": "Agency Agents 是一组按专业领域组织的 AI 智能体角色和工作流程，覆盖工程、设计、营销等任务。每个角色文件描述其职责、工作方式及交付物，可安装到 Claude Code 等工具中使用，也可作为参考。", "en": "Agency Agents is a collection of specialized AI agent roles and workflows covering areas such as engineering, design, and marketing. Each agent file describes its mission, working style, and deliverables; the agents can be installed into tools such as Claude Code or used as reference material.", "source": "https://github.com/msitarzewski/agency-agents/blob/main/README.md"}, "1255479245": {"full_name": "AhmadHassan-BTed/Noria", "zh": "Noria 是用于发现和评估机会的流水线编排工具，面向奖学金和远程职位等场景。它抓取网页、通过语言模型将内容与申请人资料匹配，并可通过 WhatsApp 发送符合条件的机会提醒；系统采用可替换的抓取、模型和消息适配器。", "en": "Noria orchestrates pipelines for discovering and evaluating opportunities such as scholarships and remote jobs. It scrapes web pages, uses language models to compare opportunities with applicant profiles, and can send matching alerts through WhatsApp using replaceable scraping, model, and messaging adapters.", "source": "https://github.com/AhmadHassan-BTed/Noria/blob/main/README.md"}, "1136590548": {"full_name": "affaan-m/ECC", "zh": "ECC 为编码智能体提供一套可复用的工程工作流，包含规划、代码审查、构建修复和安全等专用智能体与技能。它还提供规则、钩子、记忆及安全扫描，支持 Claude Code、Codex 等工具，不同平台的支持程度有所不同。", "en": "ECC supplies reusable engineering workflows for coding agents, including specialized agents and skills for planning, review, build repair, and security. It also includes rules, hooks, memory, and security scanning, with varying levels of support across Claude Code, Codex, and other tools.", "source": "https://github.com/affaan-m/ECC"}, "1162099055": {"full_name": "Leonxlnx/taste-skill", "zh": "Taste Skill 是面向编码智能体的前端设计技能，用于设计网站和应用界面，而不只是拼装常见落地页。它引导智能体选择艺术方向、寻找参考图片，并在真实浏览器中检查生成结果。", "en": "Taste Skill is a frontend design skill for coding agents building websites and app screens rather than assembling generic landing pages. It guides the agent through art direction, finding reference images, and checking the result in a real browser.", "source": "https://github.com/Leonxlnx/taste-skill"}, "1182081931": {"full_name": "Egonex-AI/Understand-Anything", "zh": "Understand Anything 将代码库、知识库或文档转换为可交互的知识图谱，帮助开发者理解项目结构。它通过多智能体分析文件、函数、类及依赖，并提供图谱浏览、语义搜索、架构导览和变更影响分析。", "en": "Understand Anything turns codebases, knowledge bases, and documentation into interactive knowledge graphs for exploration. Its multi-agent analysis maps files, functions, classes, and dependencies, with semantic search, architecture tours, and change-impact analysis.", "source": "https://github.com/Egonex-AI/Understand-Anything/blob/main/README.md"}, "1035029907": {"full_name": "earendil-works/pi", "zh": "Pi 是一个精简且可扩展的智能体运行框架，包含交互式编程智能体 CLI 及相关 TypeScript 库。用户可通过扩展、技能、提示词模板和主题调整工作流，也可使用 JSON、RPC 或 SDK 将其集成到应用中。", "en": "Pi is a minimal, extensible agent harness with an interactive coding-agent CLI and supporting TypeScript libraries. Its workflow can be customized with extensions, skills, prompt templates, and themes, or integrated into applications through JSON mode, RPC, and an SDK.", "source": "https://github.com/earendil-works/pi/blob/main/README.md"}, "1223170290": {"full_name": "nexu-io/open-design", "zh": "OpenDesign 是供团队与 AI 设计智能体协作的工作空间，可从设计需求出发创建遵循设计系统的原型并根据反馈迭代。其 Studio 展示了交互式网页原型、幻灯片、图片和动态图形等工作流，并提供可调整的模板、技能和插件。", "en": "OpenDesign is a collaborative workspace for creating and refining design-system-aware prototypes with AI agents. Its Studio supports workflows for interactive web prototypes, slides, images, and motion graphics, alongside adaptable templates, skills, and plugins.", "source": "https://github.com/nexu-io/open-design/blob/main/README.md"}}}</script>
<script>
'use strict';
const data = JSON.parse(document.getElementById('payload').textContent);
const words = {
  zh: {
    title:'找到正在上升的 AI 项目', tagline:'用真实的 Star 增长数据，筛出值得关注的 AI 开源项目。点开任意一个，看它的简介和趋势指标。',
    eyebrow:'开源趋势情报', updated:'生成于', asOf:'数据截止', monitored:'个仓库在监控', period:'统计周期', sort:'排序依据',
    daily:'日榜', weekly:'周榜', monthly:'月榜', growth:'Star 增长', acceleration:'加速度', score:'综合评分', newcomers:'新锐周榜',
    search:'搜项目名、简介或标签', tag:'标签', tagHint:'多个标签取并集', all:'全部', projects:'个项目',
    totalRanked:'本榜收录', poolScope:'只统计监控池里的仓库，不是 GitHub 全站排名', rerankNote:'已在监控池内按当前指标重排',
    loadingNote:'正在载入监控池…', newcomerNote:'新锐榜只有周榜。',
    details:'项目详情', noResults:'没有符合条件的项目，换个标签或少选几个再试试。', noBoards:'今天还没有榜单数据。',
    noIntro:'还没有整理中文简介，下面是 GitHub 原始简介。', noDescription:'暂无项目简介。', original:'GitHub 原始简介',
    readme:'读项目文档', repository:'去 GitHub 看仓库', stars:'Star 总数', current:'本期新增', previous:'上期新增',
    speed:'日均新增', accel:'加速度 / 天²', points:'综合得分', complete:'历史完整', incomplete:'历史不足', days:'天',
    metrics:'指标说明', explanation:'新增 Star 取自官方 Star 历史，是这段时间的增量，不是净增。速度 = 本期新增 ÷ 天数；加速度 =（本期速度 − 上期速度）÷ 天数，负值说明涨得慢了。综合评分把增长和加速度各自的百分位各算一半后相加；“—”表示数据不够，或者没进综合榜。',
    regular:'常规池', newcomerPool:'新锐池', history:'没有 Star 历史', boundary:'官方按日／周统计的分界不一定对齐 UTC。', labels:'标签由规则自动生成，仅供参考。'
  },
  en: {
    title:'Discover what’s rising.', tagline:'Explore rising open-source AI projects through real growth data. Select a project for its introduction and metrics.',
    eyebrow:'OPEN SOURCE INTELLIGENCE', updated:'Updated', asOf:'As of', monitored:'monitored repos', period:'Period', sort:'Rank by',
    daily:'Daily', weekly:'Weekly', monthly:'Monthly', growth:'Star growth', acceleration:'Acceleration', score:'Overall score', newcomers:'Newcomers · weekly',
    search:'Search projects, descriptions or tags', tag:'Tag', tagHint:'multiple tags are combined', all:'All', projects:'projects',
    totalRanked:'Ranked total', poolScope:'Monitored pool only, not all of GitHub', rerankNote:'Re-ranked across the monitored pool',
    loadingNote:'Loading the pool…', newcomerNote:'The newcomer board is weekly only.',
    details:'Project details', noResults:'No matching projects. Adjust your filters.', noBoards:'No ranking data is available.',
    noIntro:'No bilingual introduction has been curated yet. The original GitHub description is shown below.', noDescription:'No project description is available.', original:'Original GitHub description',
    readme:'View project source', repository:'Open GitHub repository', stars:'Total stars', current:'New stars', previous:'Previous period',
    speed:'Speed / day', accel:'Acceleration / day²', points:'Overall score', complete:'Complete history', incomplete:'Limited history', days:'days',
    metrics:'Metrics', explanation:'New stars are additions from the official Star history, not net change. Speed = additions ÷ days; acceleration = (current speed − previous speed) ÷ days. A negative value means slowing growth. Score weights growth and acceleration percentiles equally; “—” means unavailable or outside the score board.',
    regular:'Regular', newcomerPool:'Newcomers', history:'Repos without history', boundary:'Official daily and weekly boundaries may not align with UTC.', labels:'Categories are generated by rules and may be inaccurate.'
  }
};
const englishLabels = {'编程':'Coding','创作':'Creation','办公':'Productivity','研究':'Research','基础设施':'Infrastructure','建模':'3D modeling','工具':'Tool','模型':'Model','tool':'Tool','model':'Model','replica':'Replica','resource_list':'Resource list'};
const chineseLabels = {'tool':'工具','model':'模型','replica':'复刻','resource_list':'资源列表'};
const periods = ['daily','weekly','monthly'];
const sorts = ['growth','acceleration','score','newcomers'];
const windows = {daily:1, weekly:7, monthly:30};
const firstPeriod = periods.find(period => data.boards[`${period}_growth`]) || 'weekly';
const state = {lang:'zh', period:data.boards.weekly_growth ? 'weekly' : firstPeriod, sort:'growth', tags:[], search:'', selected:null};
let pool = null, poolRequest = null;
const t = key => words[state.lang][key] || key;
const label = value => (state.lang === 'en' ? englishLabels[value] : chineseLabels[value]) || value;
const escapeHTML = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const number = (value, digits=0) => value == null ? '—' : new Intl.NumberFormat(state.lang === 'zh' ? 'zh-CN' : 'en-US', {maximumFractionDigits:digits}).format(value);
const signed = (value, digits=0) => value == null ? '—' : (value > 0 ? '+' : '') + number(value, digits);
const boardKey = () => state.sort === 'newcomers' ? 'newcomers' : `${state.period}_${state.sort}`;
const board = () => data.boards[boardKey()];
const description = item => data.descriptions[String(item.repo_id)];
const summary = item => description(item)?.[state.lang] || item.description || t('noDescription');
const tagsOf = item => [...item.domains, ...item.forms, ...item.kinds];
const filtering = () => state.tags.length > 0 || state.search.trim() !== '';
const windowOf = () => state.sort === 'newcomers' ? 7 : windows[state.period];
// 排序与合格条件必须和 rank.py 一致，否则筛选后重排的名次会和发布的 JSON 对不上
const eligible = {
  growth: item => item.added != null,
  acceleration: item => item.acceleration != null,
  score: item => item.added != null && item.acceleration != null,
};
eligible.newcomers = eligible.growth;
const compare = {
  growth: (a, b) => b.added - a.added || (b.acceleration || 0) - (a.acceleration || 0) || a.repo_id - b.repo_id,
  acceleration: (a, b) => b.acceleration - a.acceleration || (b.added || 0) - (a.added || 0) || a.repo_id - b.repo_id,
  score: (a, b) => b.score - a.score || b.added - a.added || (b.acceleration || 0) - (a.acceleration || 0) || a.repo_id - b.repo_id,
};
compare.newcomers = compare.growth;
function safeURL(value) {
  try { const url = new URL(value); return url.protocol === 'https:' && url.hostname === 'github.com' ? url.href : ''; }
  catch { return ''; }
}
function matches(item, query) {
  return !query || [item.full_name, item.description, summary(item), ...tagsOf(item), ...tagsOf(item).map(label)]
    .join(' ').toLocaleLowerCase().includes(query);
}
function boardItems() {
  const scores = new Map((data.boards[`${state.period}_score`]?.items || []).map(item => [item.repo_id, item.score]));
  return (board()?.items || []).map(item => ({...item, score:scores.get(item.repo_id) ?? item.score ?? null}));
}
function poolItems() {
  if (!pool) return null;
  const query = state.search.trim().toLocaleLowerCase();
  return pool
    .filter(repo => (state.sort !== 'newcomers' || repo.newcomer) &&
      (!state.tags.length || tagsOf(repo).some(tag => state.tags.includes(tag))))
    .map(repo => ({...repo, ...repo.windows[windowOf()]}))
    .filter(item => eligible[state.sort](item) && matches(item, query))
    .sort(compare[state.sort])
    .slice(0, 100)
    .map((item, position) => ({...item, rank:position + 1}));
}
function results() { return filtering() ? poolItems() : boardItems(); }
function ensurePool() {
  return poolRequest ||= fetch('pool.json')
    .then(response => response.ok ? response.json() : [])
    .catch(() => [])
    .then(rows => { pool = rows || []; renderTags(); renderResults(); });
}
// 标签条要覆盖全池，空闲时就把池取回来，用户点第一个标签时不必等
if (window.requestIdleCallback) window.requestIdleCallback(() => ensurePool(), {timeout:3000});
function tagGroups() {
  const groups = new Map();
  const source = pool || Object.values(data.boards).flatMap(entry => entry.items);
  for (const row of source) for (const raw of tagsOf(row)) {
    const name = label(raw);
    if (!groups.has(name)) groups.set(name, []);
    if (!groups.get(name).includes(raw)) groups.get(name).push(raw);
  }
  return [...groups].sort((a, b) => a[0].localeCompare(b[0], 'zh-CN'));
}
function renderTags() {
  const chips = tagGroups().map(([name, raws]) => `<button type="button" class="chip" data-tag="${escapeHTML(name)}" aria-pressed="${raws.some(raw => state.tags.includes(raw))}">${escapeHTML(name)}</button>`).join('');
  document.getElementById('tagbar').innerHTML = `<button type="button" class="chip" data-tag="" aria-pressed="${!state.tags.length}">${escapeHTML(t('all'))}</button>${chips}`;
}
function toggle(group, value, active, disabled=false) {
  return `<button type="button" data-${group}="${value}" aria-pressed="${active}" ${disabled ? 'disabled' : ''}>${escapeHTML(t(value))}</button>`;
}
function render() {
  document.documentElement.lang = state.lang === 'zh' ? 'zh-CN' : 'en';
  document.title = `Rising Stars AI · ${t('title')}`;
  const poolMeta = data.meta.pool;
  const stamp = data.meta.generated_at.replace('T',' ').replace('+00:00',' UTC');
  document.getElementById('app').innerHTML = `
    <header class="top"><div class="logo"><span class="logo-mark">✦</span>Rising Stars <span style="color:var(--accent)">AI</span></div>
      <div class="top-right"><span class="updated">${escapeHTML(t('updated'))} ${escapeHTML(stamp)}</span><button class="language" id="language" type="button" aria-label="${state.lang === 'zh' ? 'Switch to English' : '切换到中文'}">中 / EN</button></div></header>
    <section class="hero"><div><div class="eyebrow">${escapeHTML(t('eyebrow'))} / ${escapeHTML(t('asOf'))} ${escapeHTML(data.end_day)}</div><h1>${escapeHTML(t('title'))}</h1><p>${escapeHTML(t('tagline'))}</p></div>
      <div class="pool"><strong>${number(poolMeta.repos)}</strong><span>${escapeHTML(t('monitored'))}</span></div></section>
    <div class="toolbar"><div class="group" role="group" aria-label="${escapeHTML(t('period'))}">${periods.map(period => toggle('period', period, state.period === period, !data.boards[`${period}_growth`])).join('')}</div>
      <div class="group" role="group" aria-label="${escapeHTML(t('sort'))}">${sorts.map(sort => toggle('sort', sort, state.sort === sort, !data.boards[sort === 'newcomers' ? sort : `${state.period}_${sort}`])).join('')}</div></div>
    <div class="filters"><input id="search" type="search" value="${escapeHTML(state.search)}" placeholder="⌕  ${escapeHTML(t('search'))}" aria-label="${escapeHTML(t('search'))}"></div>
    <div class="tagbar" id="tagbar" role="group" aria-label="${escapeHTML(t('tag'))}"></div>
    <div class="result-heading"><strong id="result-title"></strong><span id="result-note"></span></div><div id="results"></div>
    <footer><strong>${escapeHTML(t('metrics'))}</strong><br>${escapeHTML(t('explanation'))}<br>${escapeHTML(t('poolScope'))} · ${escapeHTML(t('labels'))}<br>${escapeHTML(t('regular'))} ${number(poolMeta.regular)} · ${escapeHTML(t('newcomerPool'))} ${number(poolMeta.newcomer)} · ${escapeHTML(t('history'))} ${number(poolMeta.no_history)}<br>${escapeHTML(t('updated'))} ${escapeHTML(stamp)} · ${escapeHTML(t('boundary'))}</footer>`;
  renderTags();
  renderResults();
}
function rank(item) { return String(item.rank).padStart(2, '0'); }
function repoName(item) {
  const parts = item.full_name.split('/');
  return `<span class="owner">${escapeHTML(parts[0])} / </span>${escapeHTML(parts.slice(1).join('/'))}`;
}
function mini(item) {
  return `<span class="mini"><span>${escapeHTML(t('current'))} <b class="highlight">${signed(item.added)}</b></span><span>${escapeHTML(t('accel'))} <b>${signed(item.acceleration,2)}</b></span><span>${escapeHTML(t('stars'))} <b>${number(item.stars)}</b></span></span>`;
}
function detail(item) {
  const info = description(item);
  const repoURL = safeURL(item.url);
  const sourceURL = safeURL(info?.source || (repoURL ? `${repoURL}#readme` : ''));
  const link = repoURL ? `<a href="${escapeHTML(repoURL)}" target="_blank" rel="noopener noreferrer">${repoName(item)} ↗</a>` : repoName(item);
  const tags = [...item.domains.map(value => [value,false]), ...item.forms.map(value => [value,true]), ...item.kinds.map(value => [value,true])]
    .filter(([value], index, all) => all.findIndex(([other]) => label(other) === label(value)) === index);
  const values = [['stars',number(item.stars)],['current',signed(item.added)],['previous',signed(item.added_previous)],['speed',number(item.velocity,2)],['accel',signed(item.acceleration,2)],['points',number(item.score,2)]];
  const activeMetric = state.sort === 'acceleration' ? 'accel' : state.sort === 'score' ? 'points' : 'current';
  return `<aside class="detail" id="detail" aria-label="${escapeHTML(t('details'))}"><div class="eyebrow">${escapeHTML(t('details'))} / #${rank(item)}</div><h2>${link}</h2>
    ${info ? '' : `<p class="notice">${escapeHTML(t('noIntro'))}</p>`}<p class="intro">${escapeHTML(summary(item))}</p>
    <div class="tags">${tags.map(([value,secondary]) => `<span class="tag ${secondary ? 'secondary' : ''}">${escapeHTML(label(value))}</span>`).join('')}</div>
    <div class="metrics">${values.map(([key,value]) => `<div class="metric ${key === activeMetric ? 'highlight' : ''}"><span>${escapeHTML(t(key))}</span><strong>${escapeHTML(value)}</strong></div>`).join('')}</div>
    <div class="quality ${item.complete ? '' : 'incomplete'}">${item.complete ? '● '+t('complete') : '◐ '+t('incomplete')+' · '+number(item.days_available)+' '+t('days')}</div>
    <div class="sources">${sourceURL ? `<a href="${escapeHTML(sourceURL)}" target="_blank" rel="noopener noreferrer">${escapeHTML(t('readme'))} ↗</a>` : ''}${repoURL ? `<a href="${escapeHTML(repoURL)}" target="_blank" rel="noopener noreferrer">${escapeHTML(t('repository'))} ↗</a>` : ''}</div>
    ${info && item.description ? `<details class="original"><summary>${escapeHTML(t('original'))}</summary><p>${escapeHTML(item.description)}</p></details>` : ''}</aside>`;
}
function renderResults() {
  const list = results();
  const current = board();
  const name = state.sort === 'newcomers' ? t('newcomers') : `${t(state.period)} · ${t(state.sort)}`;
  const title = document.getElementById('result-title');
  const note = document.getElementById('result-note');
  const target = document.getElementById('results');
  if (list === null) {
    title.textContent = name;
    note.textContent = t('poolScope');
    target.innerHTML = `<div class="empty">${escapeHTML(t('loadingNote'))}</div>`;
    ensurePool();
    return;
  }
  title.textContent = `${name} · ${number(list.length)} ${t('projects')}`;
  note.textContent = filtering()
    ? `${t('rerankNote')} ${number(pool.length)} · ${t('tagHint')}`
    : `${t('totalRanked')} ${number(current?.items.length || 0)} · ${t('poolScope')}${state.sort === 'newcomers' ? ' · '+t('newcomerNote') : ''}`;
  if (!list.length) { target.innerHTML = `<div class="empty">${escapeHTML(current ? t('noResults') : t('noBoards'))}</div>`; return; }
  const selected = list.find(item => item.repo_id === state.selected) || list[0];
  state.selected = selected.repo_id;
  target.innerHTML = `<div class="workspace"><div class="repo-list">${list.map(item => `<button type="button" class="repo-row" data-repo="${item.repo_id}" aria-pressed="${item.repo_id === selected.repo_id}"><span class="rank">${rank(item)}</span><span><span class="repo-name">${repoName(item)}</span><span class="summary">${escapeHTML(summary(item))}</span>${mini(item)}</span></button>`).join('')}</div>${detail(selected)}</div>`;
}
document.addEventListener('click', event => {
  const chip = event.target.closest('.chip');
  if (chip) {
    const raws = tagGroups().find(([name]) => name === chip.dataset.tag)?.[1] || [];
    if (!chip.dataset.tag) state.tags = [];
    else if (raws.some(raw => state.tags.includes(raw))) state.tags = state.tags.filter(tag => !raws.includes(tag));
    else state.tags = [...new Set([...state.tags, ...raws])];
    renderTags(); renderResults();
    document.querySelector(`.chip[data-tag="${CSS.escape(chip.dataset.tag)}"]`)?.focus();
    return;
  }
  const button = event.target.closest('button');
  if (!button) return;
  if (button.id === 'language') { state.lang = state.lang === 'zh' ? 'en' : 'zh'; render(); document.getElementById('language').focus(); }
  else if (button.dataset.period) { state.period = button.dataset.period; if (state.sort === 'newcomers' && state.period !== 'weekly') state.sort = 'growth'; render(); document.querySelector(`[data-period="${state.period}"]`).focus(); }
  else if (button.dataset.sort) { state.sort = button.dataset.sort; if (state.sort === 'newcomers') state.period = 'weekly'; render(); document.querySelector(`[data-sort="${state.sort}"]`).focus(); }
  else if (button.dataset.repo) {
    state.selected = Number(button.dataset.repo); renderResults();
    document.querySelector(`[data-repo="${state.selected}"]`).focus({preventScroll:true});
    if (window.matchMedia('(max-width:760px)').matches) document.getElementById('detail').scrollIntoView({block:'start'});
  }
});
document.addEventListener('input', event => {
  if (event.target.id === 'search') { state.search = event.target.value; renderResults(); }
});
render();
</script>
</body>
</html>
